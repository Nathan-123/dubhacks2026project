<!doctype html>
<!-- SYNTHETIC fixture: a small indie store with no structured data, a <select> size picker and an image-only size chart. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Linen Wrap Dress – Little Field</title>
  <meta property="og:site_name" content="Little Field">
</head>
<body>
  <nav class="breadcrumbs">Shop / Women / Dresses</nav>
  <h1>Linen Wrap Dress</h1>
  <p class="price">$128.00</p>
  <label for="size-select">Size</label>
  <select id="size-select" name="size">
    <option value="">Choose a size</option>
    <option>XS</option>
    <option>S</option>
    <option selected>M</option>
    <option disabled>L - Sold out</option>
  </select>
  <button>Add to cart</button>
  <img src="/images/size-chart-dresses.png" alt="Size chart">
  <div class="product-description">Relaxed fit, 100% linen.</div>
</body>
</html>
